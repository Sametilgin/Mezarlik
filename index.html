<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mezarlık</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 3D Container -->
  <div id="container3D"></div>

  <!-- Arama Paneli -->
   
  <div id="searchPanel">
    <input type="text" id="searchName" placeholder="Kişi adı girin" />
    <button id="searchButton">Ara</button>
  </div>

  <!-- Bilgi Kutusu: Başlangıçta gizli -->
  <div id="infoBox">
    <span class="closeBtn" id="closeInfoBox">&times;</span>
    <div id="infoContent"></div>
  </div>

  <div id="directionArrowHUD" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) rotate(0deg); width: 50px; height: 50px; background: url('Arrow.png') no-repeat center/contain; z-index: 10; display: none;"></div>


  <script type="module" src="main.js"></script>
</body>
</html>
